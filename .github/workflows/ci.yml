name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly online CVE refresh, away from the top-of-hour Actions peak.
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python scripts/check_secrets.py

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DEBUG: "1"
      SECRET_KEY: ci-only-secret-key-with-more-than-fifty-random-characters-2026
      JWT_SIGNING_KEY: ci-only-jwt-signing-key-with-more-than-fifty-random-characters
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pip install "pip-audit>=2.9,<3"
      - run: python -m pip_audit -r requirements.txt --strict --progress-spinner=off
      - run: python -m pip_audit -r requirements-cloud.txt --strict --progress-spinner=off
      - run: python manage.py check
      - run: python manage.py check --deploy --fail-level WARNING
        env:
          DEBUG: "0"
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --tag libtak-backend:ci ./backend
